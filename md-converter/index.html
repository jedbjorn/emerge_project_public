<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Converter</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3347;
    --accent: #5b7fff;
    --accent2: #7c5cfc;
    --text: #e2e5f0;
    --text-muted: #6b7280;
    --text-dim: #9ca3af;
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    --info: #60a5fa;
    --tip: #a78bfa;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  html, body { height: 100%; font-family: var(--font-sans); background: var(--bg); color: var(--text); }

  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 48px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo { font-weight: 700; font-size: 15px; letter-spacing: -.3px; }
  .logo span { color: var(--accent); }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-dim); font-size: 12px;
    cursor: pointer; transition: all .15s; font-family: var(--font-sans);
  }
  .btn:hover { border-color: var(--accent); color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #4a6bef; }

  #panes { display: flex; flex: 1; overflow: hidden; }

  #editor-pane {
    width: 50%; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); min-width: 0;
  }
  .pane-label {
    padding: 6px 14px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text-muted);
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  #editor {
    flex: 1; resize: none; border: none; outline: none;
    background: var(--bg); color: var(--text);
    font-family: var(--font-mono); font-size: 13px; line-height: 1.7;
    padding: 20px; overflow-y: auto; tab-size: 2;
  }

  #preview-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #preview-wrap { flex: 1; overflow-y: auto; }
  #preview { max-width: 820px; margin: 0 auto; padding: 32px 32px 64px; }

  /* TOC */
  #toc {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 8px 14px; display: flex; gap: 4px; flex-wrap: wrap;
    min-height: 36px; align-items: center;
  }
  .toc-link {
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500;
    text-decoration: none; color: var(--text-dim);
    border: 1px solid var(--border); background: var(--surface2);
    transition: all .15s; white-space: nowrap;
  }
  .toc-link:hover { border-color: var(--accent); color: var(--accent); }

  /* Typography */
  #preview h1 { font-size: 26px; font-weight: 700; margin: 36px 0 12px; color: var(--text); line-height: 1.2; }
  #preview h1:first-child { margin-top: 0; }
  #preview h2 { font-size: 19px; font-weight: 600; margin: 28px 0 10px; color: var(--text); }
  #preview h3 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; color: var(--text-dim); }
  #preview h4 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; color: var(--text-muted); }
  #preview p { margin: 10px 0; line-height: 1.7; color: var(--text-dim); font-size: 14px; }
  #preview a { color: var(--accent); text-decoration: none; }
  #preview a:hover { text-decoration: underline; }
  #preview strong { color: var(--text); font-weight: 600; }
  #preview em { color: var(--tip); font-style: italic; }
  #preview ul, #preview ol { padding-left: 22px; margin: 8px 0; }
  #preview li { margin: 4px 0; color: var(--text-dim); font-size: 14px; line-height: 1.6; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  .section-anchor {
    scroll-margin-top: 20px;
    border-top: 2px solid var(--accent2);
    padding-top: 24px; margin-top: 36px;
  }
  .section-anchor:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .section-anchor h1 { color: var(--accent); }

  .subsection {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 22px; margin: 16px 0;
  }
  .subsection h2 { margin-top: 0; color: var(--text); }

  /* Callouts */
  .callout {
    border-radius: 8px; padding: 12px 16px; margin: 14px 0;
    border-left: 3px solid; font-size: 13.5px; line-height: 1.6;
  }
  .callout-header { font-weight: 700; font-size: 12px; letter-spacing: .06em; margin-bottom: 4px; }
  .callout.note    { background: rgba(96,165,250,.08); border-color: var(--info); }
  .callout.note    .callout-header { color: var(--info); }
  .callout.tip     { background: rgba(167,139,250,.08); border-color: var(--tip); }
  .callout.tip     .callout-header { color: var(--tip); }
  .callout.warning { background: rgba(251,191,36,.08); border-color: var(--warning); }
  .callout.warning .callout-header { color: var(--warning); }
  .callout.danger  { background: rgba(248,113,113,.08); border-color: var(--danger); }
  .callout.danger  .callout-header { color: var(--danger); }
  .callout.success { background: rgba(52,211,153,.08); border-color: var(--success); }
  .callout.success .callout-header { color: var(--success); }
  .callout p { color: var(--text-dim); margin: 0; font-size: 13.5px; }

  /* Tables */
  #preview table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
  #preview thead { background: var(--surface2); }
  #preview th { padding: 8px 14px; text-align: left; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border); }
  #preview td { padding: 7px 14px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
  #preview tr:last-child td { border-bottom: none; }
  #preview tbody tr:hover { background: var(--surface); }

  /* Code */
  #preview code { font-family: var(--font-mono); font-size: 12px; background: var(--surface2); padding: 1px 6px; border-radius: 4px; color: var(--tip); }
  #preview pre { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 14px 0; overflow-x: auto; }
  #preview pre code { background: none; padding: 0; color: var(--text-dim); font-size: 12.5px; }

  /* Flowchart */
  .mermaid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin: 16px 0; overflow-x: auto; }
  .mermaid-wrap .mermaid { display: flex; justify-content: center; }
  .mermaid svg { max-width: 100%; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* Drag handle */
  #drag-handle {
    width: 4px; cursor: col-resize; background: var(--border);
    transition: background .15s; flex-shrink: 0; position: relative; z-index: 10;
  }
  #drag-handle:hover, #drag-handle.dragging { background: var(--accent); }

  .empty-hint { color: var(--text-muted); font-size: 13px; text-align: center; padding: 60px 20px; }
  .empty-hint strong { color: var(--text-dim); display: block; margin-bottom: 6px; font-size: 15px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">MD <span>&rarr;</span> HTML</div>
    <div class="header-actions">
      <button class="btn" onclick="loadTemplate()">Load Template</button>
      <button class="btn" onclick="clearEditor()">Clear</button>
      <button class="btn primary" onclick="render()">Convert</button>
      <button class="btn" onclick="exportHTML()">Export HTML</button>
    </div>
  </header>

  <div id="panes">
    <div id="editor-pane">
      <div class="pane-label">
        <span>Markdown</span>
        <span style="font-size:10px;color:var(--text-muted);letter-spacing:0;text-transform:none;font-weight:400">live preview</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Paste or type Markdown here...&#10;&#10;Click 'Load Template' to see all supported syntax.&#10;Click 'Convert' to render manually."></textarea>
    </div>

    <div id="drag-handle"></div>

    <div id="preview-pane">
      <div class="pane-label">Preview</div>
      <div id="toc"></div>
      <div id="preview-wrap">
        <div id="preview">
          <div class="empty-hint"><strong>MD &rarr; HTML Converter</strong>Paste Markdown and click <strong>Convert</strong>, or click <strong>Load Template</strong> to see all features.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>

    lineColor: '#6b7280',
    secondaryColor: '#1a1d27',
    tertiaryColor: '#0f1117',
    edgeLabelBackground: '#1a1d27',
    fontFamily: 'Inter, -apple-system, sans-serif',

  flowchart: { curve: 'basis', htmlLabels: true },

// ---- Marked renderer (v9 plain-object API) ----------------------
var sections = [];

marked.use({
  gfm: true,
  breaks: false,
  renderer: {
    heading: function(token) {
      var depth = token.depth;
      var text = token.text || '';
      // strip trailing # (ATX close — lexer may or may not strip it)
      var clean = text.replace(/<[^>]+>/g, '').replace(/\s+#+\s*$/, '').trim();
      var id = slugify(clean);
      if (depth === 1) {
        sections.push({ id: id, label: clean });
        return '<div class="section-anchor" id="' + id + '"><h1>' + text + '</h1>';
      }
      if (depth === 2) {
        return '<div class="subsection"><h2>' + text + '</h2>';
      }
      return '<h' + depth + '>' + text + '</h' + depth + '>\n';
    },
    blockquote: function(token) {
      // In marked v9 the blockquote token has a tokens[] array of inner block tokens
      var innerText = '';
      if (token.tokens && token.tokens.length) {
        // grab raw text from inner paragraph tokens
        innerText = token.tokens.map(function(t) { return t.text || t.raw || ''; }).join('\n');
      } else if (token.text) {
        innerText = token.text;
      }
      var lines = innerText.split('\n').map(function(l) { return l.replace(/^&gt;\s?/, '').trim(); });
      var match = lines[0].match(/^\[!(NOTE|TIP|WARNING|DANGER|SUCCESS)\]\s*(.*)?$/i);
      if (match) {
        var type = match[1].toLowerCase();
        var title = (match[2] || type).toUpperCase();
        var body = lines.slice(1).filter(Boolean).join(' ');
        return '<div class="callout ' + type + '"><div class="callout-header">' + title + '</div><p>' + body + '</p></div>\n';
      }
      return false; // fall back to default blockquote rendering
    }
  }
});

// ---- Core render ------------------------------------------------
var editorEl = document.getElementById('editor');
var previewEl = document.getElementById('preview');
var tocEl = document.getElementById('toc');

async function render() {
  sections.length = 0;
  var html = marked.parse(editorEl.value);
  html = closeOpenDivs(html);
  previewEl.innerHTML = html;
  tocEl.innerHTML = sections.map(function(s){
    return '<a class="toc-link" href="#' + s.id + '">' + s.label + '</a>';
  }).join('');
  await renderMermaid();
}

function closeOpenDivs(html) {
  var opens = (html.match(/class="section-anchor"/g) || []).length
            + (html.match(/class="subsection"/g) || []).length;
  var closes = (html.match(/<\/div>/g) || []).length;
  var needed = opens - closes;
  if (needed > 0) html += '</div>'.repeat(needed);
  return html;
}

async function renderMermaid() {
  var blocks = previewEl.querySelectorAll('code.language-mermaid, code.language-flow, code.language-flowchart');
  blocks.forEach(function(block) {
    var wrap = document.createElement('div');
    wrap.className = 'mermaid-wrap';
    var inner = document.createElement('div');
    inner.className = 'mermaid';
    inner.textContent = block.textContent;
    wrap.appendChild(inner);
    block.closest('pre').replaceWith(wrap);
  });
  try { await mermaid.run({ querySelector: '.mermaid' }); } catch(e) { console.warn('Mermaid:', e); }
}

function slugify(t) {
  return t.toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
}

// Auto-render on input (debounced)
var renderTimer;
editorEl.addEventListener('input', function() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 400);
});

// ---- Actions ----------------------------------------------------
function loadTemplate() {
  editorEl.value = TEMPLATE;
  render();
}

function clearEditor() {
  editorEl.value = '';
  previewEl.innerHTML = '<div class="empty-hint"><strong>Nothing to preview</strong>Paste Markdown and click Convert, or load the template.</div>';
  tocEl.innerHTML = '';
}

function exportHTML() {
  var styles = document.querySelector('style').outerHTML;
  var mermaidScripts = '<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"><\/script><script>mermaid.initialize({startOnLoad:true,theme:\'dark\'});<\/script>';
  var exported = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Exported</title>' + styles + mermaidScripts + '<style>body{background:#0f1117;padding:0}#preview{max-width:820px;margin:0 auto;padding:32px 32px 64px}</style></head><body><div id="preview">' + previewEl.innerHTML + '</div></body></html>';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([exported], { type: 'text/html' }));
  a.download = 'export.html';
  a.click();
}

// ---- Drag handle ------------------------------------------------
var handle = document.getElementById('drag-handle');
var editorPane = document.getElementById('editor-pane');
var dragging = false, startX, startW;

handle.addEventListener('mousedown', function(e) {
  dragging = true; startX = e.clientX; startW = editorPane.offsetWidth;
  handle.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', function(e) {
  if (!dragging) return;
  var pct = Math.min(80, Math.max(20, ((startW + e.clientX - startX) / document.getElementById('panes').offsetWidth) * 100));
  editorPane.style.width = pct + '%';
});
document.addEventListener('mouseup', function() {
  dragging = false; handle.classList.remove('dragging');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});
</script>
</body>
</html>
